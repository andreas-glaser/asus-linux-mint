name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to check if external dependencies are still available
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell Script Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning make-dpkg.sh install-asus-linux.sh uninstall-asus-linux.sh update-asus-linux.sh tests/*.sh

  syntax-check:
    name: Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check script syntax
        run: |
          echo "Checking install script syntax..."
          bash -n install-asus-linux.sh
          
          echo "Checking uninstall script syntax..."
          bash -n uninstall-asus-linux.sh

          echo "Checking update script syntax..."
          bash -n update-asus-linux.sh

          echo "Checking make-dpkg.sh syntax..."
          bash -n make-dpkg.sh

          echo "Making scripts executable..."
          chmod +x install-asus-linux.sh uninstall-asus-linux.sh update-asus-linux.sh
          
          echo "✅ All scripts have valid syntax"

  url-validation:
    name: External Dependencies Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check external URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Checking source repositories accessibility..."

          ASUSCTL_VERSION=$(sed -n 's/^ASUSCTL_VERSION="\([^"]*\)"/\1/p' install-asus-linux.sh)
          ASUSCTL_COMMIT=$(sed -n 's/^ASUSCTL_COMMIT="\([^"]*\)"/\1/p' install-asus-linux.sh)
          SUPERGFXCTL_VERSION=$(sed -n 's/^SUPERGFXCTL_VERSION="\([^"]*\)"/\1/p' install-asus-linux.sh)
          SUPERGFXCTL_COMMIT=$(sed -n 's/^SUPERGFXCTL_COMMIT="\([^"]*\)"/\1/p' install-asus-linux.sh)

          LATEST_ASUSCTL_VERSION=$(gh api repos/OpenGamingCollective/asusctl/releases/latest --jq .tag_name)
          test "$ASUSCTL_VERSION" = "$LATEST_ASUSCTL_VERSION"
          test "$(gh api "repos/OpenGamingCollective/asusctl/git/commits/$ASUSCTL_COMMIT" --jq .sha)" = "$ASUSCTL_COMMIT"
          echo "✅ asusctl $ASUSCTL_VERSION is the latest stable release and its commit is accessible"
          
          LATEST_SUPERGFXCTL_VERSION=$(curl --proto '=https' --tlsv1.2 -fsSL 'https://gitlab.com/api/v4/projects/asus-linux%2Fsupergfxctl/releases?per_page=1' | jq -r '.[0].tag_name')
          test "$SUPERGFXCTL_VERSION" = "$LATEST_SUPERGFXCTL_VERSION"
          test "$(curl --proto '=https' --tlsv1.2 -fsSL "https://gitlab.com/api/v4/projects/asus-linux%2Fsupergfxctl/repository/tags/$SUPERGFXCTL_VERSION" | jq -r .commit.id)" = "$SUPERGFXCTL_COMMIT"
          echo "✅ optional supergfxctl $SUPERGFXCTL_VERSION is the latest stable release and its commit is accessible"

          ASUSCTL_LOCK_SHA256=$(sed -n 's/^ASUSCTL_LOCK_SHA256="\([^"]*\)"/\1/p' install-asus-linux.sh)
          test "$(sha256sum "assets/asusctl-$ASUSCTL_VERSION-Cargo.lock" | awk '{print $1}')" = "$ASUSCTL_LOCK_SHA256"
          echo "✅ asusctl dependency lock matches its pinned hash"

          SUPERGFXCTL_LOCK_SHA256=$(sed -n 's/^SUPERGFXCTL_LOCK_SHA256="\([^"]*\)"/\1/p' install-asus-linux.sh)
          test "$(sha256sum "assets/supergfxctl-$SUPERGFXCTL_VERSION-Cargo.lock" | awk '{print $1}')" = "$SUPERGFXCTL_LOCK_SHA256"
          echo "✅ supergfxctl dependency lock matches its pinned hash"
          
          echo "✅ All external dependencies are accessible"

  test-basic-functionality:
    name: Basic Functionality Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test script help and version info
        run: |
          chmod +x install-asus-linux.sh uninstall-asus-linux.sh
          
          echo "Testing install script basic execution..."
          # Test that script shows help/version without actually installing
          if grep -q "SCRIPT_VERSION" install-asus-linux.sh; then
            echo "✅ Install script contains version information"
          fi
          
          if grep -q "print_header" install-asus-linux.sh; then
            echo "✅ Install script has proper structure"
          fi
          
          echo "Testing uninstall script basic execution..."
          if grep -q "SCRIPT_VERSION" uninstall-asus-linux.sh; then
            echo "✅ Uninstall script contains version information" 
          fi
          
          if grep -q "print_header" uninstall-asus-linux.sh; then
            echo "✅ Uninstall script has proper structure"
          fi

          echo "Testing update script basic execution..."
          chmod +x update-asus-linux.sh
          ./update-asus-linux.sh --help > /dev/null
          echo "✅ Update script help works"

          if grep -q "SCRIPT_VERSION" update-asus-linux.sh; then
            echo "✅ Update script contains version information"
          fi

  test-installer:
    name: Installer Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test on distributions similar to Linux Mint base
        container: 
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    container: ${{ matrix.container }}
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run isolated installer tests
        run: |
          bash tests/test-installer.sh
          bash tests/test-uninstaller.sh
          bash tests/test-update.sh
          bash tests/test-dpkg.sh

  security-scan:
    name: Installer Security Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security checks
        run: |
          set -euo pipefail

          ! grep -RE 'curl[^|]*\|[[:space:]]*(ba)?sh' --include='*.sh' --include='*.md' .
          ! grep -RE 'wget[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(ba)?sh' --include='*.sh' --include='*.md' .
          ! grep -RE 'http://.*\.(sh|bash|tar|zip)' --include='*.sh' .
          ! grep -RE 'git[[:space:]]+reset[[:space:]]+--hard|git[[:space:]]+fetch[[:space:]]+--all' --include='*.sh' .
          ! grep -RE 'sudo[[:space:]]+(usermod|gpasswd)' --include='*.sh' .
          ! grep -RE 'uses:.*@(main|master|v[0-9]+)$' .github/workflows
          grep -q '^INSTALL_SUPERGFXCTL="${ASUS_INSTALL_SUPERGFXCTL:-0}"$' install-asus-linux.sh
          grep -q '^UPDATE_FIRMWARE="${ASUS_UPDATE_FIRMWARE:-0}"$' install-asus-linux.sh
          echo "✅ Installer security contracts passed"

  dependency-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned cargo-audit
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Audit asusctl dependencies
        run: cargo audit --file assets/asusctl-6.3.11-Cargo.lock

      - name: Audit optional supergfxctl dependencies
        run: cargo audit --file assets/supergfxctl-5.2.7-Cargo.lock

  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check documentation
        run: |
          echo "Checking documentation completeness..."
          
          # Check README has required sections
          for section in "Features" "Requirements" "Installation" "Usage"; do
            if grep -q "$section" README.md; then
              echo "✅ README contains $section section"
            else
              echo "❌ README missing $section section"
              exit 1
            fi
          done

          # Keep project prose free of typographic dashes and curly quotes.
          if git grep -n -I -P '[\x{2013}\x{2014}\x{2018}\x{2019}\x{201C}\x{201D}]' -- ':!assets/*.lock'; then
            echo "ERROR: Replace en/em dashes and curly quotes with plain punctuation"
            exit 1
          fi
          
          # Check CHANGELOG follows format
          if grep -q "## \[" CHANGELOG.md; then
            echo "✅ CHANGELOG follows semantic versioning format"
          else
            echo "❌ CHANGELOG format needs improvement"
            exit 1
          fi
          
          # Check LICENSE exists
          if [ -f LICENSE ]; then
            echo "✅ LICENSE file exists"
          else
            echo "❌ LICENSE file missing"
            exit 1
          fi
